[project]
name = "issuepilot"
version = "0.4.0"
description = "Durable evidence-first GitHub repository investigation agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "rank-bm25==0.2.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.8",
]

[project.scripts]
issuepilot-eval = "issuepilot.evaluation:main"
issuepilot-investigation-eval = "issuepilot.investigation_evaluation:main"
issuepilot-import = "issuepilot.ingest:main"
issuepilot-license-audit = "issuepilot.license_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issuepilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
